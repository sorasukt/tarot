name: Deploy Tarot Worker

on:
  pull_request:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/deploy-tarot-worker.yml"
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/deploy-tarot-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tarot-worker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Worker checks
        run: npm run check

      - name: Validate Worker bundle
        env:
          AUTH0_CLIENT_SECRET: ci-auth0-placeholder
          GEMINI_API_KEY: ci-gemini-placeholder
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
        run: npx wrangler deploy --dry-run

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Worker checks
        run: npm run check

      - name: Provision D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="sorasukt-members") | .uuid' | head -n1)
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            npx wrangler d1 create sorasukt-members
            DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="sorasukt-members") | .uuid' | head -n1)
          fi
          test -n "$DB_ID"
          echo "D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Provision R2 archive bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx wrangler r2 bucket info sorasukt-ai-archive >/dev/null 2>&1; then
            npx wrangler r2 bucket create sorasukt-ai-archive
          fi

      - name: Generate production Wrangler config
        env:
          STRIPE_PRICE_SUB_WEEKLY: ${{ vars.STRIPE_PRICE_SUB_WEEKLY }}
          STRIPE_PRICE_SUB_MONTHLY: ${{ vars.STRIPE_PRICE_SUB_MONTHLY }}
          STRIPE_PRICE_SUB_YEARLY: ${{ vars.STRIPE_PRICE_SUB_YEARLY }}
          STRIPE_PRICE_ONETIME_WEEKLY: ${{ vars.STRIPE_PRICE_ONETIME_WEEKLY }}
          STRIPE_PRICE_ONETIME_MONTHLY: ${{ vars.STRIPE_PRICE_ONETIME_MONTHLY }}
          STRIPE_PRICE_ONETIME_YEARLY: ${{ vars.STRIPE_PRICE_ONETIME_YEARLY }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config=JSON.parse(fs.readFileSync('wrangler.json','utf8'));
          config.d1_databases=[{binding:'DB',database_name:'sorasukt-members',database_id:process.env.D1_DATABASE_ID,migrations_dir:'migrations'}];
          config.r2_buckets=[{binding:'ARCHIVE',bucket_name:'sorasukt-ai-archive'}];
          for(const name of ['STRIPE_PRICE_SUB_WEEKLY','STRIPE_PRICE_SUB_MONTHLY','STRIPE_PRICE_SUB_YEARLY','STRIPE_PRICE_ONETIME_WEEKLY','STRIPE_PRICE_ONETIME_MONTHLY','STRIPE_PRICE_ONETIME_YEARLY']){
            config.vars[name]=process.env[name]||'';
          }
          fs.writeFileSync('wrangler.production.json',JSON.stringify(config,null,2));
          NODE

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.production.json

      - name: Validate production Worker deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.production.json --dry-run

      - name: Deploy Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.production.json
